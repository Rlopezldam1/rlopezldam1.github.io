<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlayHook</title>
  <meta name="description" content="Descubre qué canción suena en un vídeo y guárdala en tus playlists.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..100,400..800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f2f2f0; --text: #000000; --muted: #6e6e6a; --accent: #2b3cf0; --line: #dcdcd7; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #000000; --text: #f2f2f0; --muted: #8f8f8a; --accent: #8f98ff; --line: #2a2a2a; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 "Archivo", system-ui, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 56px 16px 64px; min-height: 100vh; display: flex; flex-direction: column; }
    .brand { font-stretch: 62.5%; font-weight: 800; font-size: 1.6rem; letter-spacing: -0.01em; }
    h1 { font-stretch: 62.5%; font-weight: 800; font-size: clamp(3rem, 12vw, 5.2rem); line-height: 0.95; margin: 72px 0 20px; letter-spacing: -0.01em; }
    p.lead { color: var(--muted); font-size: 1.15rem; max-width: 34ch; margin: 0 0 32px; }
    .soon { display: inline-block; padding: 14px 22px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
    @media (prefers-color-scheme: dark) { .soon { color: #000; } }
    footer { margin-top: auto; padding-top: 72px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 0.95rem; }
    footer a { color: var(--text); }
    footer span { color: var(--muted); }
  </style>
</head>
<body>
<main>
  <div class="brand">PlayHook</div>
  <h1>¿Qué canción<br>sonaba?</h1>
  <p class="lead">Comparte el vídeo con PlayHook o deja que la escuche. Te decimos qué canción es y la guardas en tus playlists.</p>
  <div><span class="soon">Próximamente en Google Play</span></div>
  <footer>
    <a href="/playhook-legal/">Política de privacidad</a>
    <a href="mailto:rubenlopezdavalillo9@gmail.com">Contacto</a>
    <span>© 2026 Rubén López-Davalillo Ledesma</span>
  </footer>
</main>
</body>
</html>
